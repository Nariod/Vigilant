name: Vendor sync

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "core/Cargo.toml"
      - "app/Cargo.toml"

permissions:
  contents: write

concurrency:
  group: vendor-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  re-vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate vendor directory
        run: |
          mv .cargo/config.toml /tmp/cargo-config.toml
          cargo vendor vendor
          mv /tmp/cargo-config.toml .cargo/config.toml
      - name: Commit updated vendor directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor Cargo.lock
          if git diff --cached --quiet; then
            echo "vendor directory already in sync"
            exit 0
          fi
          git commit -m "Re-vendor dependencies after lockfile update"
          git push
