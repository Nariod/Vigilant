app-id: io.github.nariod.Vigilant
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: vigilant

build-options:
  env:
    CARGO_HOME: /run/build/vigilant/cargo-home
    PATH: /usr/lib/sdk/rust-stable/bin:/usr/bin:/bin

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --device=dri
  - --socket=wayland

modules:
  - name: vigilant
    buildsystem: simple
    build-commands:
      - cargo --offline build --release
      - install -Dm755 target/release/vigilant /app/bin/vigilant
      - install -Dm644 data/io.github.nariod.Vigilant.desktop /app/share/applications/io.github.nariod.Vigilant.desktop
      - install -Dm644 data/io.github.nariod.Vigilant.metainfo.xml /app/share/metainfo/io.github.nariod.Vigilant.metainfo.xml
      - install -Dm644 data/icons/io.github.nariod.Vigilant.svg /app/share/icons/hicolor/scalable/apps/io.github.nariod.Vigilant.svg
    sources:
      - type: dir
        path: .